# CI runs the same checks as a local `just test && just vet && just check`
# (the justfile stays the source of truth for them), plus a tidy-module
# check and govulncheck. It runs on every push to any branch, so a
# Dependabot branch is checked before its PR is merged, and weekly, so
# a newly published vulnerability shows up without a push.
#
# Third-party actions are pinned to commit SHAs (the tag is in the
# trailing comment); Dependabot keeps them current.
name: CI

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, vet and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Test
        run: just test

      - name: Vet
        run: just vet

      - name: Lint
        run: just check

      - name: Shell scripts
        run: shellcheck scripts/*.sh

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Known vulnerabilities in code htt calls
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
